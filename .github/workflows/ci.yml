name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src tests eval

      - name: Format check
        run: uv run ruff format --check src tests eval

      # Les tests utilisent l'encodeur de hachage : aucun téléchargement de
      # modèle, aucun appel réseau, aucune clé API.
      - name: Tests
        run: uv run pytest --cov=pubrag --cov-report=term-missing
