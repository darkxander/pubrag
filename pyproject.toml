[project]
name = "pubrag"
version = "0.2.0"
description = "Retrieval-augmented question answering over a personal corpus of PubMed publications"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alexandre Mathieu" }]
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
    "rank-bm25>=0.2.2",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
pubrag = "pubrag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pubrag"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
